name: Release

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'
      - '[0-9]+.x'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: data-acquisition
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/platform-contracts
          path: platform-contracts
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify with workspace
        run: |
          cat > "${GITHUB_WORKSPACE}/go.work" <<'EOF'
          go 1.23

          use (
            ./platform-contracts
            ./data-acquisition
          )
          EOF
          GOWORK="${GITHUB_WORKSPACE}/go.work" go vet ./...
          GOWORK="${GITHUB_WORKSPACE}/go.work" go build -o /dev/null ./cmd/data-acquisition
        working-directory: data-acquisition

  release:
    name: Tag & Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install semantic-release tooling
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@24.2.3 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/github@11.0.1 \
            @semantic-release/release-notes-generator@14.0.3 \
            conventional-changelog-conventionalcommits@8.0.0
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
